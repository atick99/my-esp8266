name: ESP8266 Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Core 2.7.4
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@2.7.4

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2:FlashFreq=80,FlashSize=4M1M \
            --build-property "compiler.c.extra_flags=-DCORE_DEBUG_LEVEL=0" \
            --build-property "build.flash_size=4MB" \
            main.cpp

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-Firmware
          path: ./*.bin
