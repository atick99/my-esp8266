name: ESP8266 Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@2.7.4

      - name: Compile
        run: |
          mv *.cpp esp_evil_twin.ino 2>/dev/null || true
          mv *.ino esp_evil_twin.ino 2>/dev/null || true
          
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 \
            --build-property "build.flash_size=4MB" \
            --build-property "build.filesystem=1MB" \
            esp_evil_twin.ino

      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: Firmware
          path: ./*.bin
